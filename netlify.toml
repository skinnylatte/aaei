[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

[functions]
  directory = "netlify/functions"

# Old addresses from when the case studies were called demos.
[[redirects]]
  from = "/demos"
  to = "/case-studies/"
  status = 301

[[redirects]]
  from = "/demos/*"
  to = "/case-studies/:splat"
  status = 301
